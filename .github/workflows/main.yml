name: CI
on:
  push:
  pull_request:
    branches: [master]

jobs:
  build_meson:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    name: Compile and Run Tests
    steps:
      - uses: actions/checkout@v4
      - name: install mamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: 2.6.0-0
          environment-file: .github/meson_build_env.yml
          init-shell: ${{ runner.os == 'Windows' && 'cmd.exe' || 'bash' }}
      - name: Compile argp
        if: runner.os != 'Windows'
        shell: bash -l {0}
        run: |
          meson setup build
          meson test -C build
      - name: Compile argp
        if: runner.os == 'Windows'
        shell: cmd /C CALL {0}
        run: |
          meson setup build
          meson test -C build
